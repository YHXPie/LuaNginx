name: Version Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '请输入 `yes` 确认清空版本记录'
        required: true
        default: 'no'

jobs:
  reset-records:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "操作已取消"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clear version files
        run: |
          echo "" > version-mainline.txt
          echo "" > version-stable.txt

      - name: Commit and Push Reset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add version-mainline.txt version-stable.txt
          
          # 用 git diff 检查文件是否真的发生了变化。如果文件本来就是空的，git commit 会报错退出，则需这里拦截
          if git diff --staged --quiet; then
            echo "文件已经是空状态，无需提交"
            exit 0
          fi
          
          git commit -m "chore: reset version tracking records"
          
          # 老规矩，推送前 rebase 一下防撞车
          git pull --rebase origin main
          git push
